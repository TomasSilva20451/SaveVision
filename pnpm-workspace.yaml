# Gate de idade: 0 no repo; o Dependabot impõe 4320 min via CLI — ver minimumReleaseAgeExclude.
minimumReleaseAge: 0
minimumReleaseAgeExclude:
  - next
  - eslint-config-next
  - "@next/*"
  - "@appthreat/*"
  - "@cyclonedx/*"
  - "@babel/*"
  - minimatch

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

onlyBuiltDependencies:
  - "@prisma/engines"
  - prisma
  - esbuild
  - argon2
