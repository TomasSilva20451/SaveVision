services:
  postgres:
    image: postgres:17
    container_name: fintwin-postgres
    environment:
      POSTGRES_USER: fintwin
      POSTGRES_PASSWORD: fintwin
      POSTGRES_DB: fintwin
    ports:
      - "5433:5432"
    volumes:
      - fintwin_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintwin -d fintwin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fintwin_pg:
