version: 2
# pnpm: ver .npmrc (minimum-release-age-exclude) se o job npm falhar com ERR_PNPM_NO_MATCHING_VERSION em eslint-config-next.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      prisma:
        patterns:
          - "@prisma/*"
          - "prisma"
      playwright:
        patterns:
          - "@playwright/*"
      opentelemetry:
        patterns:
          - "@opentelemetry/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
