version: 2
# pnpm: Dependabot usa --config.minimum-release-age=4320; ver .npmrc e pnpm-workspace.yaml (minimumReleaseAgeExclude).
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      prisma:
        patterns:
          - "@prisma/*"
          - "prisma"
      playwright:
        patterns:
          - "@playwright/*"
      opentelemetry:
        patterns:
          - "@opentelemetry/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
