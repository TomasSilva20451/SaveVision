name: Terraform staging plan

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-staging-plan.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: Plan (staging, read-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt check
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: Terraform init
        run: terraform -chdir=infra/terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=infra/terraform validate

      - name: Terraform plan staging
        run: |
          terraform -chdir=infra/terraform plan \
            -var-file=environments/staging.tfvars \
            -input=false \
            -no-color | tee /tmp/tf-plan.txt
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_PLAN_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_PLAN_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: eu-west-1
        continue-on-error: true

      - name: Plan note without AWS creds
        if: failure()
        run: |
          echo "Sem credenciais AWS_PLAN_* — plan local apenas com: terraform plan -var-file=environments/staging.tfvars"
          terraform -chdir=infra/terraform plan -var-file=environments/staging.tfvars -input=false -refresh=false || true
