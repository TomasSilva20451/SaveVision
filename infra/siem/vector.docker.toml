# Vector no host Docker (compose.observability.yml)

[sources.docker_app]
type = "docker_logs"
include_containers = ["fintwin-app", "app-production", "app-staging", "fintwin-postgres"]

[sources.host_logs]
type = "file"
include = ["/host-logs/fintwin-*.log", "/host-logs/fintwin-backup.log", "/host-logs/fintwin-ops-alert.log"]
read_from = "end"

[transforms.parse_json]
type = "remap"
inputs = ["docker_app", "host_logs"]
source = '''
  parsed, err = parse_json(.message)
  if err == null {
    . = merge(., parsed)
  }
  if !exists(.service) {
    .service = "FinTwin"
  }
'''

[sinks.loki]
type = "loki"
inputs = ["parse_json"]
endpoint = "http://loki:3100"
encoding.codec = "json"
labels.service = "{{ service }}"
labels.env = "{{ env }}"
labels.event = "{{ event }}"
