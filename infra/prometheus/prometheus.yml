global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: fintwin
    metrics_path: /api/metrics
    scheme: http
    bearer_token_file: /etc/prometheus/secrets/metrics_token
    static_configs:
      - targets: ["host.docker.internal:3000"]
        labels:
          environment: production-local
          service: fintwin

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
