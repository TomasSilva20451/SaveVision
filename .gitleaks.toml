title = "FinTwin gitleaks"

[extend]
useDefault = true

[allowlist]
paths = [
  '''\.env\.example$''',
  '''\.env\..*\.example$''',
  '''docs/''',
  '''pnpm-lock\.yaml''',
]
regexes = [
  # Identificador idempotente histórico do modelo «Desafio 300 €».
  # Não é uma credencial; a exceção literal manté o scanner restritivo.
  '''^desafio-300-eur$''',
]
